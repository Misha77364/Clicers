<script>
// ============ ЗВУКИ ============
let audioCtx = null;
let audioUnlocked = false;
function initAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function unlockAudio() {
  if (audioUnlocked) return;
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  audioUnlocked = true;
}
document.addEventListener('touchstart', unlockAudio, { once: true });
document.addEventListener('click', unlockAudio, { once: true });
function playTone(freq, duration, type, volume) {
  initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function soundClick() { playTone(800, 0.05, 'square', 0.05); }
function soundBuy() { playTone(500, 0.1, 'sine', 0.1); setTimeout(() => playTone(700, 0.15, 'sine', 0.1), 80); }
function soundWin() { playTone(600, 0.1, 'sine', 0.15); setTimeout(() => playTone(800, 0.1, 'sine', 0.15), 100); setTimeout(() => playTone(1000, 0.3, 'sine', 0.15), 200); }
function soundLose() { playTone(300, 0.2, 'sawtooth', 0.1); setTimeout(() => playTone(200, 0.3, 'sawtooth', 0.1), 150); }
function soundCase() { playTone(400, 0.05, 'square', 0.08); }
function soundPromo() { playTone(700, 0.1, 'sine', 0.15); setTimeout(() => playTone(900, 0.1, 'sine', 0.15), 100); setTimeout(() => playTone(1200, 0.2, 'sine', 0.15), 200); }

const RARITY_NAMES = { 1: 'Обычный', 2: 'Редкий', 3: 'Эпический', 4: 'Легендарный', 5: 'Мифический' };
const RARITY_CLASSES = { 1: 'rarity-common', 2: 'rarity-rare', 3: 'rarity-epic', 4: 'rarity-legend', 5: 'rarity-mythic' };

const BASE_CHANCE = 50;

// ============ АККАУНТЫ ============
let currentUser = null;

function getAccounts() {
  const s = localStorage.getItem('swillAccounts');
  if (!s) return {};
  try { return JSON.parse(s); } catch { return {}; }
}
function saveAccounts(acc) { localStorage.setItem('swillAccounts', JSON.stringify(acc)); }

function getDB() {
  if (!currentUser) return null;
  const acc = getAccounts();
  if (!acc[currentUser]) return null;
  return acc[currentUser].db;
}
function saveDB(db) {
  if (!currentUser) return;
  const acc = getAccounts();
  acc[currentUser].db = db;
  saveAccounts(acc);
}

function autoLogin() {
  const savedUser = localStorage.getItem('swillCurrentUser');
  if (savedUser) {
    const acc = getAccounts();
    if (acc[savedUser]) {
      currentUser = savedUser;
      startGame();
      return true;
    }
  }
  document.getElementById('authScreen').classList.add('active');
  return false;
}

let isRegisterMode = false;

function toggleAuth() {
  isRegisterMode = !isRegisterMode;
  document.getElementById('authTitle').textContent = isRegisterMode ? 'РЕГИСТРАЦИЯ' : 'ВХОД';
  document.getElementById('authBtn').textContent = isRegisterMode ? 'ЗАРЕГИСТРИРОВАТЬСЯ' : 'ВОЙТИ';
  document.getElementById('authSwitch').textContent = isRegisterMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
}

function authAction() {
  const login = document.getElementById('authLogin').value.trim();
  const password = document.getElementById('authPassword').value.trim();
  const res = document.getElementById('authResult');
  const remember = document.getElementById('rememberMe').checked;
  
  if (!login || !password) { res.textContent = 'Заполните все поля'; return; }
  if (login.length < 3) { res.textContent = 'Логин минимум 3 символа'; return; }
  if (password.length < 3) { res.textContent = 'Пароль минимум 3 символа'; return; }
  
  const acc = getAccounts();
  
  if (isRegisterMode) {
    if (acc[login]) { res.textContent = 'Логин занят'; return; }
    acc[login] = {
      password: password,
      db: {
        coins: 50,
        currentSkin: null,
        ownedSkins: [],
        ownedItems: [],
        usedPromos: [],
        target: null,
        background: 'default',
        clickPower: 1,
        passiveIncome: 0,
        upgrades: {}
      }
    };
    saveAccounts(acc);
    currentUser = login;
    if (remember) localStorage.setItem('swillCurrentUser', login);
    startGame();
  } else {
    if (!acc[login]) { res.textContent = 'Нет такого аккаунта'; return; }
    if (acc[login].password !== password) { res.textContent = 'Неверный пароль'; return; }
    currentUser = login;
    if (remember) localStorage.setItem('swillCurrentUser', login);
    else localStorage.removeItem('swillCurrentUser');
    startGame();
  }
}

function startGame() {
  document.getElementById('authScreen').classList.remove('active');
  document.getElementById('userInfo').textContent = 'Игрок: ' + currentUser;
  updateUI();
}

function logout() {
  currentUser = null;
  localStorage.removeItem('swillCurrentUser');
  document.getElementById('authScreen').classList.add('active');
  document.getElementById('authLogin').value = '';
  document.getElementById('authPassword').value = '';
  document.getElementById('authResult').textContent = '';
}

// ============ ФОН ============
function applyBackground(bg) {
  const body = document.getElementById('bodyEl');
  body.classList.remove('bg-promo', 'bg-class');
  if (bg === 'promo') body.classList.add('bg-promo');
  else if (bg === 'class') body.classList.add('bg-class');
}

// ============ ИНТЕРФЕЙС ============
function showTab(tab) {
  ['clicker','shop','upgrade','upgrades','cases','sell','withdraw','promo'].forEach(t => {
    document.getElementById('tab-'+t).style.display = (t === tab) ? 'block' : 'none';
    document.getElementById('nav-'+t).classList.toggle('active', t === tab);
  });
  if (tab === 'cases') renderCases();
  if (tab === 'withdraw') renderWithdraw();
  if (tab === 'upgrades') renderUpgrades();
  if (tab === 'sell') renderSell();
}

function renderCases() {
  const cases = [
    { id: 'common', icon: '📦', name: 'Обычный кейс', price: 50, rarityMax: 2 },
    { id: 'rare', icon: '🎁', name: 'Редкий кейс', price: 150, rarityMax: 4 },
    { id: 'legend', icon: '💎', name: 'Легендарный кейс', price: 500, rarityMax: 5 },
    { id: 'school', icon: '🎒', name: 'Школьный кейс', price: 300, rarityMax: 3 },
    { id: 'photo', icon: '📸', name: 'Фотокейс', price: 1000, rarityMax: 5 },
    { id: 'class', icon: '🏫', name: 'Кейс класса', price: 2000, rarityMax: 5, includeClass: true }
  ];
  const container = document.getElementById('casesList');
  container.innerHTML = '';
  cases.forEach(c => {
    let pool = ALL_SKINS.filter(s => s.rarity <= c.rarityMax);
    if (!c.includeClass) pool = pool.filter(s => !s.promoOnly);
    const div = document.createElement('div');
    div.className = 'case';
    let contentsHtml = '<div class="case-contents">';
    pool.forEach(s => {
      contentsHtml += `<div class="case-content-item" title="${s.name}"><img src="${s.img}"></div>`;
    });
    contentsHtml += '</div>';
    div.innerHTML = `
      <div class="case-icon">${c.icon}</div>
      <div class="case-name">${c.name}</div>
      <div class="case-price">${c.price} монет</div>
      <div style="color:#ff8c00; font-size:12px; margin-bottom:5px;">Возможные награды:</div>
      ${contentsHtml}
      <button class="case-open" onclick="openCase('${c.id}')">ОТКРЫТЬ</button>
    `;
    container.appendChild(div);
  });
}

function renderSell() {
  const db = getDB();
  const container = document.getElementById('sellList');
  container.innerHTML = '';
  
  const counts = {};
  db.ownedSkins.forEach(id => { counts[id] = (counts[id] || 0) + 1; });
  
  const uniqueSkins = [...new Set(db.ownedSkins)];
  if (uniqueSkins.length === 0) {
    container.innerHTML = '<p style="color:#ff8c00; text-align:center;">У вас нет скинов для продажи</p>';
    return;
  }
  
  uniqueSkins.forEach(id => {
    const s = ALL_SKINS.find(x => x.id === id);
    if (!s) return;
    const count = counts[id];
    const isCurrent = db.currentSkin === id;
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <img src="${s.img}">
      <div class="name ${RARITY_CLASSES[s.rarity]}">${s.name} (x${count})</div>
      <div class="price">Продажа: ${Math.floor(s.price / 2)} монет за штуку</div>
      <button onclick="sellSkin('${id}')" ${isCurrent && count === 1 ? 'disabled' : ''}>Продать 1 шт.</button>
    `;
    container.appendChild(div);
  });
}

function renderWithdraw() {
  const db = getDB();

  ITEMS.forEach(item => {
    const count = db.ownedItems.filter(i => i === item.id).length;
    const div = document.createElement('div');
    div.className = 'item-card';
    div.innerHTML = `
      <div class="item-icon">${item.icon}</div>

        <div class="item-name">${item.name} (${count} шт.)</div>
        <div class="item-desc">Выводится за ${item.price} монет</div>
      </div>

        <button onclick="withdrawItem('${item.id}')">Вывести</button>
      </div>

  });
}

function renderUpgrades() {
  const db = getDB();
  const container = document.getElementById('upgradesList');
  container.innerHTML = '';
  UPGRADES.forEach(up => {
    const count = db.upgrades[up.id] || 0;

function updateUI() {
  const db = getDB();
  if (!db) return;
  document.getElementById('balance').textContent = 'Монеты: ' + db.coins;
  document.getElementById('clickInfo').textContent = 'За клик: ' + db.clickPower + ' монет | В секунду: ' + db.passiveIncome;
  applyBackground(db.background);
  
  const cur = ALL_SKINS.find(s => s.id === db.currentSkin);
  const curEl = document.getElementById('currentIcon');
  const curName = document.getElementById('currentName');
  if (cur) {
    curEl.innerHTML = `<img src="${cur.img}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;">`;
    curName.textContent = cur.name;
    curName.className = 'name ' + RARITY_CLASSES[cur.rarity];
  } else {
    curEl.textContent = '❓';
    curName.textContent = 'Не выбран';
  }
  
  const btnContent = document.getElementById('clickBtnContent');
  if (cur) {
    btnContent.innerHTML = `<img src="${cur.img}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
  } else {
    btnContent.textContent = 'КЛИК';
  }
  
  if (db.target) {
    const t = ALL_SKINS.find(s => s.id === db.target);
    if (t) {
      document.getElementById('targetIcon').innerHTML = `<img src="${t.img}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;">`;
      document.getElementById('targetName').textContent = t.name;
      document.getElementById('targetName').className = 'name ' + RARITY_CLASSES[t.rarity];
    } else {
      const item = ITEMS.find(i => i.id === db.target);
      if (item) {
        document.getElementById('targetIcon').textContent = item.icon;
        document.getElementById('targetName').textContent = item.name;
      }
    }
  } else {
    document.getElementById('targetIcon').textContent = '❓';
    document.getElementById('targetName').textContent = 'Не выбран';
  }
  
  const row = document.getElementById('skinsRow');
  row.innerHTML = '';
  const counts = {};
  db.ownedSkins.forEach(id => { counts[id] = (counts[id] || 0) + 1; });
  const uniqueOwned = [...new Set(db.ownedSkins)];
  if (uniqueOwned.length === 0) {
    row.innerHTML = '<p style="color:#ff8c00; font-size:12px;">Купите скины в магазине</p>';
  }
  uniqueOwned.forEach(id => {
    const s = ALL_SKINS.find(x => x.id === id);
    if (!s) return;
    const selected = db.currentSkin === id;
    const div = document.createElement('div');
    div.className = 'skin-mini' + (selected ? ' selected' : '');
    div.innerHTML = `
      <img src="${s.img}">
      <div class="name ${RARITY_CLASSES[s.rarity]}">${s.name}</div>
      ${counts[id] > 1 ? `<div class="count">${counts[id]}</div>` : ''}
    `;
    div.onclick = () => setSkin(id);
    row.appendChild(div);
  });
  
  const shop = document.getElementById('shopList');
  shop.innerHTML = '';
  ALL_SKINS.filter(s => s.inShop).forEach(s => {
    const owned = db.ownedSkins.includes(s.id);
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <img src="${s.img}">
      <div class="name ${RARITY_CLASSES[s.rarity]}">${s.name} (${RARITY_NAMES[s.rarity]})</div>
      <div class="price">${s.price} монет</div>
      <button onclick="buy('${s.id}')">${owned ? 'Купить ещё' : 'Купить'}</button>
    `;
    shop.appendChild(div);
  });
  
  const tl = document.getElementById('targetList');
  tl.innerHTML = '';
  ALL_SKINS.forEach(t => {
    if (t.promoOnly && !db.ownedSkins.includes(t.id)) return;
    const selected = db.target === t.id;
    const div = document.createElement('div');

    div.innerHTML = `
      <img src="${t.img}">
      <div class="name ${RARITY_CLASSES[t.rarity]}">${t.name} (${RARITY_NAMES[t.rarity]}) — ${t.price} монет</div>

    div.innerHTML = `
      <div style="font-size:50px;">${it.icon}</div>

// ============ ДЕЙСТВИЯ ============
function doClick() {
  soundClick();
  const db = getDB();
  db.coins += db.clickPower;
  saveDB(db);
  updateUI();
}

function buy(id) {
  const db = getDB();
  const s = ALL_SKINS.find(x => x.id === id);
  if (!s || db.coins < s.price) return alert('Недостаточно монет');
  soundBuy();
  db.coins -= s.price;
  db.ownedSkins.push(id);
  db.currentSkin = id;
  saveDB(db);
  updateUI();
}

function sellSkin(id) {
  const db = getDB();
  const s = ALL_SKINS.find(x => x.id === id);
  if (!s) return;
  const count = db.ownedSkins.filter(x => x === id).length;
  if (count === 0) return;
  if (db.currentSkin === id && count === 1) {
    document.getElementById('sellResult').textContent = 'Нельзя продать последний экземпляр текущего скина!';
    soundLose();
    return;
  }
  soundBuy();
  const idx = db.ownedSkins.indexOf(id);
  db.ownedSkins.splice(idx, 1);
  const sellPrice = Math.floor(s.price / 2);
  db.coins += sellPrice;
  saveDB(db);
  document.getElementById('sellResult').textContent = `💰 Продано: ${s.name} за ${sellPrice} монет`;
  updateUI();
  renderSell();
}

function buyUpgrade(id) {
  const db = getDB();
  const up = UPGRADES.find(u => u.id === id);
  if (!up) return;
  if (db.coins < up.price) return alert('Недостаточно монет');
  soundBuy();
  db.coins -= up.price;
  db.upgrades[id] = (db.upgrades[id] || 0) + 1;
  up.effect(db);
  saveDB(db);
  updateUI();
  renderUpgrades();
}

function setSkin(id) {
  const db = getDB();
  if (!db.ownedSkins.includes(id)) return;
  soundClick();
  db.currentSkin = id;
  saveDB(db);
  updateUI();
}

function setTarget(id) {
  const db = getDB();
  soundClick();
  db.target = id;
  saveDB(db);
  updateUI();
}

    db.coins += db.passiveIncome;
    saveDB(db);

  }
}, 1000);

// ============ КЕЙСЫ ============
function openCase(type) {
  const db = getDB();
  let price = 0;
  let pool = [];
  
  if (type === 'common') { price = 50; pool = ALL_SKINS.filter(s => s.rarity <= 2 && !s.promoOnly); }
  else if (type === 'rare') { price = 150; pool = ALL_SKINS.filter(s => s.rarity <= 4 && !s.promoOnly); }
  else if (type === 'legend') { price = 500; pool = ALL_SKINS.filter(s => !s.promoOnly); }
  else if (type === 'school') { price = 300; pool = ALL_SKINS.filter(s => s.rarity <= 3 && !s.promoOnly); }
  else if (type === 'photo') { price = 1000; pool = ALL_SKINS.filter(s => !s.promoOnly); }
  else if (type === 'class') { price = 2000; pool = ALL_SKINS; }
  
  if (db.coins < price) {
    document.getElementById('caseResult').textContent = 'Недостаточно монет!';
    soundLose();
    return;
  }
  soundCase();
  db.coins -= price;
  saveDB(db);
  updateUI();
  
  const track = document.getElementById('caseAnimTrack');
  track.innerHTML = '';
  const items = [];
  for (let i = 0; i < 40; i++) {
    const s = pool[Math.floor(Math.random() * pool.length)];
    items.push({ type: 'skin', data: s });
  }
  const isItem = Math.random() < 0.02;
  let winItem;
  if (isItem) {
    winItem = ITEMS[Math.floor(Math.random() * ITEMS.length)];
    items[35] = { type: 'item', data: winItem };
  } else {
    const weightedPool = [];
    pool.forEach(s => {
      const weight = Math.max(1, 6 - s.rarity);
      for (let k = 0; k < weight; k++) weightedPool.push(s);
    });
    winItem = weightedPool[Math.floor(Math.random() * weightedPool.length)];
    items[35] = { type: 'skin', data: winItem };
  }
  
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'case-anim-item';
    if (it.type === 'skin') div.innerHTML = `<img src="${it.data.img}">`;
    else div.textContent = it.data.icon;
    track.appendChild(div);
  });
  
  document.getElementById('caseAnim').classList.add('active');
  document.getElementById('caseAnimResult').textContent = '';
  document.getElementById('caseAnimClose').style.display = 'none';
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  
  setTimeout(() => {
    const offset = -(35 * 110) + 150;
    track.style.transition = 'transform 4s cubic-bezier(0.2, 0.8, 0.2, 1)';
    track.style.transform = `translateX(${offset}px)`;
  }, 100);
  
  setTimeout(() => {
    if (isItem) {
      db.ownedItems.push(winItem.id);
      document.getElementById('caseAnimResult').textContent = `🎉 ${winItem.icon} ${winItem.name}`;
    } else {
      db.ownedSkins.push(winItem.id);
      db.currentSkin = winItem.id;
      document.getElementById('caseAnimResult').textContent = `🎉 ${winItem.name}`;
    }
    saveDB(db);
    updateUI();
    soundWin();
    document.getElementById('caseAnimClose').style.display = 'block';
  }, 4200);
}

function closeCaseAnim() {
  soundClick();
  document.getElementById('caseAnim').classList.remove('active');
}

// ============ ВЫВОД ============
function withdrawItem(id) {
  const db = getDB();
  const item = ITEMS.find(i => i.id === id);
  if (!item) return;
  const idx = db.ownedItems.indexOf(id);
  if (idx === -1) {
    document.getElementById('withdrawResult').textContent = 'У вас нет этого предмета!';
    soundLose();
    return;
  }
  soundBuy();
  db.ownedItems.splice(idx, 1);
  db.coins += item.price;
  saveDB(db);
  document.getElementById('withdrawResult').textContent = `💰 Выведено: ${item.icon} ${item.name} за ${item.price} монет`;
  updateUI();
  renderWithdraw();
}

// ============ ПРОМОКОДЫ ============
function activatePromo() {
  const db = getDB();
  const code = document.getElementById('promoInput').value.trim().toUpperCase();
  const res = document.getElementById('promoResult');
  if (!PROMOS[code]) { res.textContent = '❌ Неверный промокод'; soundLose(); return; }
  if (db.usedPromos.includes(code)) { res.textContent = '❌ Уже использован'; soundLose(); return; }
  const promo = PROMOS[code];
  
  if (promo.type === 'item') {
    for (let i = 0; i < promo.count; i++) db.ownedItems.push(promo.itemId);
    db.usedPromos.push(code);
    saveDB(db);
    const item = ITEMS.find(i => i.id === promo.itemId);
    res.textContent = `✅ Получено: ${item.icon} ${item.name} x${promo.count}`;
    soundPromo();
    updateUI();
  } else if (promo.type === 'background') {
    db.background = promo.bg;
    db.usedPromos.push(code);
    saveDB(db);
    res.textContent = `✅ Получен фон!`;
    soundPromo();
    applyBackground(promo.bg);
    updateUI();
  } else if (promo.type === 'skin') {
    db.ownedSkins.push(promo.skinId);
    db.currentSkin = promo.skinId;
    db.usedPromos.push(code);
    saveDB(db);
    const skin = ALL_SKINS.find(s => s.id === promo.skinId);
    res.textContent = `✅ Получен скин: ${skin.name}`;
    soundPromo();
    updateUI();
  }
}

// ============ АПГРЕЙДЕР ============
function spinWheel() {
  const db = getDB();
  if (!db.target) { document.getElementById('upgradeResult').textContent = 'Выберите цель!'; return; }
  if (!db.currentSkin) { document.getElementById('upgradeResult').textContent = 'Выберите текущий скин!'; return; }
  if (db.spinning) return;
  
  db.spinning = true;
  saveDB(db);
  document.getElementById('spinBtn').disabled = true;
  
  const cur = ALL_SKINS.find(s => s.id === db.currentSkin);
  let targetPrice = 0;
  const skinTarget = ALL_SKINS.find(s => s.id === db.target);
  const itemTarget = ITEMS.find(i => i.id === db.target);
  if (skinTarget) targetPrice = skinTarget.price;
  else if (itemTarget) targetPrice = itemTarget.price;
  
  const priceDiff = targetPrice - cur.price;
  let penalty = 0;
  if (priceDiff > 0) penalty = Math.floor(priceDiff / 30);
  const realChance = Math.max(10, BASE_CHANCE - penalty);
  
  const greenDeg = realChance * 3.6;
  document.getElementById('wheel').style.background = `conic-gradient(#00ff00 0deg ${greenDeg}deg, #555 ${greenDeg}deg 360deg)`;
  document.getElementById('wheelCenter').textContent = realChance + '%';
  
  const spins = 3 + Math.floor(Math.random() * 3);
  const extra = Math.random() * 360;
  const totalAngle = spins * 360 + extra;
  
  const wheel = document.getElementById('wheel');
  let current = 0;
  const duration = 3000;
  const startTime = performance.now();
  
  function animate(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    current = totalAngle * eased;
    wheel.style.transform = `rotate(${current}deg)`;
    if (progress < 1) requestAnimationFrame(animate);
    else finishSpin(extra, realChance);
  }
  requestAnimationFrame(animate);
}

function finishSpin(extra, realChance) {
  const db = getDB();
  const angle = (360 - (extra % 360)) % 360;
  const isWin = angle < realChance * 3.6;
  const resultEl = document.getElementById('upgradeResult');
  const skinTarget = ALL_SKINS.find(s => s.id === db.target);
  const itemTarget = ITEMS.find(i => i.id === db.target);
  
  if (isWin) {
    if (skinTarget) {
      db.ownedSkins.push(skinTarget.id);
      db.currentSkin = skinTarget.id;
      resultEl.textContent = `✅ УСПЕХ! Получен скин: ${skinTarget.name}`;
      soundWin();
    } else if (itemTarget) {
      db.ownedItems.push(itemTarget.id);
      resultEl.textContent = `✅ УСПЕХ! Получен предмет: ${itemTarget.icon} ${itemTarget.name}`;
      soundWin();
    }
  } else {
    const cur = ALL_SKINS.find(s => s.id === db.currentSkin);
    if (cur) {
      const idx = db.ownedSkins.indexOf(cur.id);
      if (idx !== -1) db.ownedSkins.splice(idx, 1);
      resultEl.textContent = `❌ ПРОВАЛ! Потерян: ${cur.name}`;
      const remaining = db.ownedSkins.filter(x => x === cur.id).length;
      if (remaining === 0) db.currentSkin = null;
    } else {
      resultEl.textContent = `❌ ПРОВАЛ! Ничего не потеряно`;
    }
    soundLose();
  }
  db.target = null;
  db.spinning = false;
  saveDB(db);
  document.getElementById('spinBtn').disabled = false;
  updateUI();
}

// ============ СТАРТ ============
autoLogin();
</script>
</body>
</html>
